<style>
        /* Pixel Art CSS Styling */
        .pixelated {
            image-rendering: pixelated;
        }
        
        .pixel-grid {
            background-image: 
                linear-gradient(to right, rgba(174, 173, 170, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(174, 173, 170, 0.1) 1px, transparent 1px);
            background-size: 24px 24px; /* Adjust grid size as needed */
        }

        .room-border {
             /* Simulate thick, chunky borders using box-shadow for a cleaner "pixel" look without actual 1px borders as per design system */
            box-shadow: inset 0 0 0 4px var(--tw-colors-surface-container-high);
        }

        /* Sprite placeholder styling */
        .sprite-agent {
            width: 24px;
            height: 24px;
            background-color: var(--tw-colors-primary);
            border-radius: 4px; /* Slightly rounded, not a perfect circle to hint at pixels */
            position: relative;
        }
        .sprite-agent::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background-color: var(--tw-colors-surface-container-lowest);
            border-radius: 2px;
        }

        .sprite-object {
            background-color: var(--tw-colors-secondary-dim);

        }
